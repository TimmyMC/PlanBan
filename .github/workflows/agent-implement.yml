name: Agent · implement

# Stage 2 (CI implementation) — OFF BY DEFAULT.
#
# This repo implements LOCALLY: Claude Code on the maintainer's machine, authed as
# the least-privilege Zlyzart bot, driven by the `implement-next` routine
# (.claude/commands/implement-next.md). That keeps a prompt-injectable implementer's
# blast radius off a CI runner's credentials, and pairs with ready-author-guard.yml
# so only trusted-authored issues are ever implemented. This CI workflow is kept as
# an opt-in fallback only.
#
# To re-enable CI implementation: set repo var CI_IMPLEMENT_ENABLED=true AND wire
# IMPLEMENTER_TOKEN as a GitHub App token minted at runtime with
# actions/create-github-app-token (a static PAT is unsupported — claude-code-action's
# actor precheck 403s a non-collaborator PAT, and an App installation token can't be
# pasted as a static secret because it expires hourly).
#
# When enabled, behavior is unchanged: tier (model) derives from complexity:<tier>;
# one issue per invocation under the repo-wide `agents-global` concurrency; claims
# with status:in-progress; releases/re-queues on failure; ATTEMPT_CAP → needs-decision.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement (blank = highest-priority ready issue)"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agents-global
  cancel-in-progress: false

env:
  ATTEMPT_CAP: "3"

jobs:
  implement:
    name: Implement issue
    runs-on: ubuntu-latest
    # OFF unless CI_IMPLEMENT_ENABLED is explicitly set (this repo implements
    # locally — see the header). On a label event, only react to status:ready.
    if: >
      vars.AGENTS_ENABLED == 'true' &&
      vars.CI_IMPLEMENT_ENABLED == 'true' &&
      (github.event_name != 'issues' || github.event.label.name == 'status:ready')
    steps:
      - name: Select & claim issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          set -euo pipefail
          n="${INPUT_ISSUE:-$EVENT_ISSUE}"
          if [ -z "$n" ]; then
            # No explicit target: highest priority, then oldest, among ready issues
            # that carry a complexity label.
            read -r n tier < <(gh issue list --state open --label status:ready \
              --json number,labels,createdAt --jq '
                map({number, created: .createdAt,
                     complexity: ([.labels[].name | select(startswith("complexity:"))][0] // ""),
                     prio: ([.labels[].name | select(startswith("priority:"))][0] // "priority:medium")})
                | map(select(.complexity != ""))
                | map(.prank = ({"priority:critical":0,"priority:high":1,"priority:medium":2,"priority:low":3}[.prio] // 2))
                | sort_by(.prank, .created) | .[0] // empty
                | "\(.number)\t\(.complexity)"' | tr '\t' ' ') || true
          fi
          if [ -z "${n:-}" ] || [ "$n" = "null" ]; then
            echo "Nothing to implement."; echo "target=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          labels=$(gh issue view "$n" --json labels --jq '[.labels[].name] | join(",")')
          # Must be ready and not already claimed.
          case ",$labels," in
            *",status:in-progress,"*) echo "#$n already in progress — skipping."; echo "target=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          case ",$labels," in
            *",status:ready,"*) : ;;
            *) echo "#$n is not status:ready — skipping."; echo "target=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          tier=$(printf '%s' "$labels" | tr ',' '\n' | grep '^complexity:' | head -1 || true)
          if [ -z "$tier" ]; then
            echo "#$n has no complexity label — skipping."; echo "target=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$tier" in
            complexity:haiku)  model="claude-haiku-4-5-20251001" ;;
            complexity:sonnet) model="claude-sonnet-4-6" ;;
            complexity:opus)   model="claude-opus-4-8" ;;
            *) echo "Unknown tier $tier — skipping."; echo "target=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Claim it.
          gh issue edit "$n" --remove-label status:ready --add-label status:in-progress
          echo "target=$n"  >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Selected #$n ($tier → $model)."

      - name: Checkout repository
        if: steps.pick.outputs.target != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Implement with Claude
        id: claude
        if: steps.pick.outputs.target != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only reached when CI_IMPLEMENT_ENABLED=true. IMPLEMENTER_TOKEN must be a
          # GitHub App token minted at runtime (see header) so the PR triggers CI;
          # a static PAT is unsupported.
          github_token: ${{ secrets.IMPLEMENTER_TOKEN || secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--model ${{ steps.pick.outputs.model }} --allowed-tools "Bash,Read,Edit,Write,Grep,Glob"'
          prompt: |
            Implement issue #${{ steps.pick.outputs.target }} in ${{ github.repository }}.
            Follow CLAUDE.md and docs/CONSTITUTION.md exactly; honor the issue's
            "Acceptance criteria" comment.

            1. Comment on the issue that work has started.
            2. Create a branch off trunk named `claude/issue-${{ steps.pick.outputs.target }}-<slug>`.
            3. Plan, then implement the change. Add/extend tests per the test taxonomy.
            4. Run the local gate before opening the PR: `cargo fmt --all`,
               `cargo clippy --workspace --all-targets -- -D warnings`, `cargo test --workspace`,
               and `bash scripts/gate-guard.sh origin/trunk`. Fix anything red.
            5. Open a DRAFT PR into trunk that `Closes #${{ steps.pick.outputs.target }}`.
               Add the `agent-authored` label and copy the issue's `complexity:<tier>`
               label onto the PR (the reviewer routing reads it).
            Keep the change scoped to this one issue. Do not edit anything under
            `.github/`, `scripts/gate-guard.sh`, or the gate tests — those are owner-only;
            if the issue seems to require it, stop and say so in the PR description.

      - name: Release claim on failure (re-queue / cap)
        if: steps.pick.outputs.target != '' && steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ steps.pick.outputs.target }}
        run: |
          set -euo pipefail
          MARKER="<!-- agent-deferred -->"
          # Count prior deferrals to enforce the attempt cap.
          prior=$(gh issue view "$N" --json comments \
                    --jq "[.comments[] | select(.body | startswith(\"$MARKER\"))] | length")
          gh issue edit "$N" --remove-label status:in-progress || true
          if [ "$prior" -ge "$(( ATTEMPT_CAP - 1 ))" ]; then
            gh issue edit "$N" --add-label status:needs-decision
            gh issue comment "$N" --body "$MARKER
            ⚠️ Implementation failed ${ATTEMPT_CAP}× (last run could not complete — usage limit or a real blocker). Labeled \`status:needs-decision\` for a human to look."
          else
            gh issue edit "$N" --add-label status:deferred
            gh issue comment "$N" --body "$MARKER
            ⏳ Deferred: the implement run didn't complete (likely the Claude usage limit). The reconciler will retry. Attempt $((prior + 1))/${ATTEMPT_CAP}."
          fi

      - name: Surface real failures
        if: steps.pick.outputs.target != '' && steps.claude.outcome == 'failure'
        run: echo "::warning::Implement run for #${{ steps.pick.outputs.target }} did not complete; issue re-queued."
