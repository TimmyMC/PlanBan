name: Ready author guard

# Defense-in-depth for the local-implementer model. `status:ready` is the trigger
# the local implementer (Claude Code on the maintainer's machine) acts on, and it
# reads the issue body/criteria — attacker-controllable text — so reaching ready is
# guarded on BOTH ends:
#
#   (1) trusted AUTHOR  — the issue must be authored by a repo COLLABORATOR, read
#       from github.event.issue.author_association (no API call, not spoofable,
#       auto-maintained — no name list to keep in sync). Stops a third party getting
#       auto-implemented by filing an issue and waiting for a stray label.
#   (2) owner PROMOTER  — `status:ready` must be applied BY AN OWNER (the human
#       go-decision). Stops a hijacked bot (an injected local Zlyzart session — itself
#       a collaborator) from self-authoring an issue and self-promoting it to ready.
#       `status:ready` a non-owner forged can't trigger.
#
# If either fails, `status:ready` is stripped and the issue goes to
# `status:needs-decision`. A relabel by the reconciler's GITHUB_TOKEN does NOT fire
# this event (GitHub anti-recursion), so legitimate deferred→ready re-queues are
# unaffected; this only ever judges human/PAT-applied promotions.
#
# Always-on, independent of AGENTS_ENABLED. Belt-and-suspenders: the /implement-next
# routine ALSO restricts to collaborator-authored issues. Keep OWNERS in sync with
# ci-complete.yml + label-guard.yml.

on:
  issues:
    types: [labeled]

permissions:
  issues: write

concurrency:
  group: ready-author-guard-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guard:
    name: Enforce trusted author + owner promotion on status:ready
    runs-on: ubuntu-latest
    if: github.event.label.name == 'status:ready'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
      ASSOC: ${{ github.event.issue.author_association }}
      SENDER: ${{ github.event.sender.login }}
      # Logins whose go-decision promotes an issue to implementation. Mirror the
      # OWNERS in ci-complete.yml / label-guard.yml.
      OWNERS: "TimmyMC"
    steps:
      - name: Revoke status:ready unless a collaborator authored it AND an owner promoted it
        run: |
          set -euo pipefail
          lc() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }  # GitHub logins are case-insensitive
          sender_lc=$(lc "$SENDER")

          # (1) Author must be a repo collaborator (or owner / org member). author_association
          # is in the event payload — no API call, reflects the author's CURRENT access.
          author_ok=false
          case "$ASSOC" in OWNER|MEMBER|COLLABORATOR) author_ok=true ;; esac

          # (2) status:ready must be applied by an OWNERS login (the human go-decision).
          owner_ok=false
          for o in $OWNERS; do [ "$(lc "$o")" = "$sender_lc" ] && owner_ok=true && break; done

          if $author_ok && $owner_ok; then
            echo "#$N: collaborator @$AUTHOR ($ASSOC), promoted by owner @$SENDER — leaving status:ready."
            exit 0
          fi

          reason=""
          $author_ok || reason="author @$AUTHOR is not a repo collaborator (association: $ASSOC)"
          if ! $owner_ok; then
            [ -n "$reason" ] && reason="$reason; "
            reason="${reason}status:ready was applied by @$SENDER, not an owner (\`$OWNERS\`)"
          fi
          echo "::warning::#$N: revoking status:ready — $reason."
          gh issue edit "$N" --remove-label status:ready --add-label status:needs-decision

          # Comment once per issue (dedup on a marker, like label-guard.yml).
          MARKER="<!-- ready-author-guard -->"
          existing=$(gh api "repos/$GH_REPO/issues/$N/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" 2>/dev/null | head -1 || true)
          if [ -z "$existing" ]; then
            gh issue comment "$N" --body "$MARKER
          🔒 Revoked \`status:ready\` — $reason.

          Auto-implementation requires an issue **authored by a repo collaborator** **and** promoted to \`status:ready\` **by an owner** (\`$OWNERS\`) — the human go-decision a compromised bot can't forge. Moved to \`status:needs-decision\`; an owner can re-apply \`status:ready\` to proceed. (See docs/agent-pipeline.md → *Local implementer mode*.)"
          fi
