name: CI complete

# PRs only. Trunk changes exclusively via auto-merged PRs whose CI already
# passed, and the ruleset requires branches be up to date before merging (so the
# merged result was tested) — a post-merge `push` run on trunk would just be a
# redundant re-run. Running on both `push` and `pull_request` is also what
# doubles every check on a branch that has an open PR.
# `labeled`/`unlabeled` are included so that applying the `gate-change-approved`
# label re-runs CI — that re-evaluates the Gate integrity job, which reads the
# label, and lets a green run flow into auto-merge. On a pure label event only
# Gate integrity re-runs: the expensive jobs (check/coverage/frontend/desktop)
# skip (`github.event.action != 'labeled'/'unlabeled'`) since no code changed and
# their prior results stand — the `CI complete` aggregator passes on skipped, so
# auto-merge still fires without burning a full matrix on a label toggle.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # NO `pull_request_review` trigger. Neither `submitted` nor `dismissed` may spawn a
  # CI run here — both leave a SECOND `CI complete` check on the commit alongside the
  # existing one, and the ruleset's required-status-check evaluation then reports the
  # stale/cancelled run's failure and blocks the merge forever (the bug that stalled
  # every gate-change PR).
  #   * `submitted` (an approval) is handled by rerun-ci-on-approval.yml, which re-runs
  #     the EXISTING failed run in place so gate-integrity re-evaluates with the approval
  #     present and the SAME check flips green — one check run, no stale failure.
  #   * `dismissed` is intentionally NOT handled: a push that revokes an approval already
  #     fires `synchronize` (which re-runs CI), and that `dismissed` event racing the
  #     `synchronize` run under this workflow's cancel-in-progress is exactly what left a
  #     cancelled, permanently-failing duplicate `CI complete` check. Re-failing
  #     gate-integrity on a dismissal is redundant anyway: a revoked approval sets
  #     reviewDecision=REVIEW_REQUIRED, which blocks the merge on its own.

# Restrict GITHUB_TOKEN to read-only by default; override per-job when more is needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Keyed on the PR number (stable across pull_request and pull_request_review; falls
# back to the ref). Only a new *push* supersedes in-progress CI. An approval
# (pull_request_review) must NOT cancel a running push — that would kill the expensive
# jobs, which the review run itself skips, leaving them red. Instead the approval run
# queues behind the push, then re-evaluates Gate integrity green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which areas of the codebase changed so downstream jobs can skip
  # when irrelevant (e.g. docs-only PRs skip the Rust compile + Playwright).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      any_code: ${{ steps.filter.outputs.any_code }}
    steps:
      - uses: actions/checkout@v6
      # paths-filter resolves changed paths from PR context; it only applies on
      # pull_request events. On pull_request_review the step is skipped and the
      # outputs are empty (falsey) — every expensive job then skips (each also
      # requires event_name == 'pull_request'), while gate-integrity still runs
      # via its pull_request_review clause. The job itself still succeeds.
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # Filters live in .github/filters.yml (DRY'd with YAML anchors; see the
          # change-to-impact matrix there).
          filters: .github/filters.yml

  # Stops an agent from making CI green by deleting a test or loosening a gate
  # instead of fixing the code. Rides the CI-success rail: if this fails, the
  # whole run fails and auto-merge (gated on CI success) never fires. A deliberate
  # gate change is cleared *only* by an approving PR review from an owner-allowlisted
  # login (computed in the "owner gate approval" step) — never by a label an agent
  # could apply to its own PR. On an owner APPROVAL the guard re-evaluates via
  # rerun-ci-on-approval.yml re-running this run in place (reading the approval at
  # runtime); it also fires directly on label and review-`dismissed` events so a
  # revoked approval re-locks the gate even when no new code was pushed.
  gate-integrity:
    name: Gate integrity
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading PR reviews + posting the unblock comment go through endpoints
      # governed by pull-requests write for a PR.
      pull-requests: write
    if: needs.changes.outputs.any_code == 'true' || github.event.action == 'labeled' || github.event.action == 'unlabeled' || github.event_name == 'pull_request_review'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # The ONLY signal that clears a gate change: an APPROVED review whose author
      # is in the owner allowlist. Reviews are identity-bound — an agent cannot
      # submit one as the owner — so unlike the old `gate-change-approved` label
      # this can't be self-applied by the PR's author. We take each allowlisted
      # login's *latest* non-comment review state, so a later CHANGES_REQUESTED or
      # DISMISSED revokes a prior approval.
      - name: Owner gate approval
        id: approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # Space-separated logins whose approving review clears a gate change.
          OWNERS: "TimmyMC"
        run: |
          approved=false
          if [ -n "$PR" ]; then
            declare -A last
            while IFS=$'\t' read -r login state; do
              case "$state" in
                APPROVED|CHANGES_REQUESTED|DISMISSED) last["$login"]="$state" ;;
              esac
            done < <(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
                       --jq '.[] | [.user.login, .state] | @tsv')
            for o in $OWNERS; do
              [ "${last[$o]:-}" = "APPROVED" ] && approved=true
            done
          fi
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          echo "Owner gate approval: $approved"

      - name: Guard against weakened tests/gates
        id: guard
        shell: bash
        env:
          # Use the payload path (not github.base_ref, which is empty on
          # pull_request_review events) so the base fetch works when an owner approves.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_CHANGE_APPROVED: ${{ steps.approval.outputs.approved }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          set +e
          output=$(GATE_GUARD_FILES_OUT=guard-files.txt scripts/gate-guard.sh "origin/$BASE_REF")
          exit_code=$?
          set -e
          echo "$output"
          # Capture the bullet-point findings + the flagged files (for diff deeplinks).
          findings=$(printf '%s\n' "$output" | grep '^  - ' || true)
          {
            echo "findings<<GATE_FINDINGS_END"
            printf '%s\n' "$findings"
            echo "GATE_FINDINGS_END"
            echo "files<<GATE_FILES_END"
            cat guard-files.txt 2>/dev/null || true
            echo "GATE_FILES_END"
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Comment — action required to unblock
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          FILES: ${{ steps.guard.outputs.files }}
        shell: bash
        run: |
          MARKER="<!-- gate-change-required -->"
          # Don't spam: skip if we already posted this comment on the PR
          existing=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          [ -n "$existing" ] && exit 0
          # Build clickable deeplinks to each flagged file's diff. GitHub anchors a
          # file on the Files-changed tab as #diff-<sha256(path)>.
          links=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            anchor=$(printf '%s' "$f" | sha256sum | cut -d' ' -f1)
            links+="- [\`$f\`]($PR_URL/files#diff-$anchor)"$'\n'
          done <<< "$FILES"
          # Assemble the body line-by-line (indentation-independent — no heredoc).
          lines=("$MARKER"
            "**Gate integrity:** this PR changes CI/test machinery — an owner must approve it to unblock (CI re-runs on approval). If unintended, restore the original gate instead.")
          if [ -n "$links" ]; then
            lines+=("" "$links")
          fi
          body=$(printf '%s\n' "${lines[@]}")
          jq -n --arg body "$body" '{body: $body}' \
            | gh api "repos/$REPO/issues/$PR/comments" -X POST --input -

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    # Code scan — only on actual PR code events, not label/review toggles.
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Lint & test
    needs: changes
    # Windows matches the dev environment and the cfg(windows) cmd-quoting path.
    # (Adding an ubuntu leg to exercise the sh path is tracked in BACKLOG.md.)
    runs-on: windows-latest
    if: needs.changes.outputs.rust == 'true' && github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@v6

      # Pinned to match rust-toolchain.toml — bump both together.
      - name: Install Rust (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Set up Node (offline fake tracker in the black-box tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Fail on unused dependencies. False positives (deps pulled in for a
      # feature with no direct code reference, e.g. libsqlite3-sys/bundled) are
      # listed under [package.metadata.cargo-machete] ignored in the crate's
      # Cargo.toml rather than suppressed here.
      - name: Unused dependencies (cargo-machete)
        run: cargo machete

      - name: Test
        run: cargo test --workspace

  coverage:
    name: Coverage
    needs: changes
    runs-on: windows-latest
    if: needs.changes.outputs.rust == 'true' && github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (+ llvm-tools)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Set up Node (offline fake tracker in the black-box tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Gate: line coverage must stay at/above the floor (the real gate). The floor
      # is centralized in .github/coverage-thresholds.json (shared with the frontend
      # Vitest thresholds via ui/vite.config.ts) so there's one place to ratchet.
      # Two-phase llvm-cov: collect once, then emit lcov AND a text summary without
      # re-running tests (--lcov and --summary-only can't be combined in one call).
      # lcov is kept for the best-effort Codecov upload below (issue #30).
      - name: Coverage (fail under floor)
        shell: bash
        run: |
          FLOOR=$(jq .rust_lines .github/coverage-thresholds.json)
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          # Surface the level on the PR (Checks → Coverage → Summary). $GITHUB_STEP_SUMMARY
          # is Markdown, so fence the table; this write must not mask the gate's exit code.
          {
            echo "### Rust coverage (floor ${FLOOR}% lines)"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only --fail-under-lines "$FLOOR"

      # Best-effort upload for the README badge; never fails the gate (so a
      # missing CODECOV_TOKEN can't block merges).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend
    needs: changes
    runs-on: windows-latest
    if: needs.changes.outputs.frontend == 'true' && github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint · format (Biome)
        run: pnpm run lint

      # Vitest enforces the unit-coverage thresholds (centralized in
      # .github/coverage-thresholds.json via vite.config.ts). Tee the run to a log,
      # then append a fenced coverage table to the PR step summary while preserving
      # the gate's exit code (a threshold breach must still fail the step).
      - name: Unit tests + coverage (Vitest)
        shell: bash
        run: |
          status=0
          pnpm test:cov 2>&1 | tee /tmp/vitest-cov.log || status=$?
          {
            echo '### Frontend unit coverage (Vitest)'
            echo '```'
            cat /tmp/vitest-cov.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm run test:e2e

      # Separate, report-only e2e coverage track (not gated): uploaded as an
      # artifact so it can be inspected and later graduate to its own gate.
      - name: Upload e2e coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: ui/coverage-e2e
          retention-days: 7

      # Reliability: on a failed (retried) run, keep the Playwright trace/report
      # so the failure is debuggable instead of a silent flake.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  desktop:
    name: Desktop app
    needs: changes
    # src-tauri is intentionally OUTSIDE the cargo workspace (WebView2 system
    # deps), so the workspace lint/test/coverage jobs never touch it. This job
    # is what actually gates the desktop shell: it must compile + pass clippy.
    runs-on: windows-latest
    if: needs.changes.outputs.desktop == 'true' && github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      # generate_context! embeds ui/dist at compile time, so the frontend
      # must be built before the shell will compile.
      - name: Build frontend (embedded by the shell)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The shell crate is outside the workspace, so `cargo test --workspace`
      # never reaches it — run its tests here (startup smoke tests etc.).
      - name: Test (shell unit tests)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Aggregator: always runs so branch protection has a single stable required
  # check ("CI complete") even when upstream jobs are skipped for docs-only PRs.
  # Passes when every upstream job either succeeded or was skipped.
  # Branch protection must require this job's name ("CI complete").
  ci-complete:
    name: CI complete
    needs: [changes, gate-integrity, secret-scan, check, coverage, frontend, desktop]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI complete — all checks passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' \
            | jq -e '[.[].result] | all(. == "success" or . == "skipped")'
