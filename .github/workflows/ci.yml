name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref so stale CI can't race auto-merge and
# we don't burn minutes on commits that have already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test
    # Windows matches the dev environment and the cfg(windows) cmd-quoting path.
    # (Adding an ubuntu leg to exercise the sh path is tracked in BACKLOG.md.)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to match rust-toolchain.toml — bump both together.
      - name: Install Rust (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node (offline fake tracker in the black-box tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  coverage:
    name: coverage (>=75% lines)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (+ llvm-tools)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Set up Node (offline fake tracker in the black-box tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Gate: line coverage must stay at/above the bar. Local baseline at the
      # time this gate landed was ~79%; 75% leaves a small buffer for churn.
      - name: Coverage (fail under 75% lines)
        run: cargo llvm-cov --workspace --fail-under-lines 75

  frontend:
    name: build · e2e
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint · format (Biome)
        run: pnpm run lint

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm run test:e2e

  tauri:
    name: tauri shell
    # src-tauri is intentionally OUTSIDE the cargo workspace (WebView2 system
    # deps), so the workspace `check`/`coverage` jobs never touch it. This job
    # is what actually gates the desktop shell: it must compile + pass clippy.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # generate_context! embeds ui/dist at compile time, so the frontend
      # must be built before the shell will compile.
      - name: Build frontend (embedded by the shell)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  supply-chain:
    name: supply-chain (cargo-deny)
    # Ubuntu: this is pure metadata analysis (advisories, licenses, bans), no
    # Windows-specific behavior, and it's cheaper/faster than a Windows runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo-deny (advisories · licenses · bans · sources)
        run: cargo deny check
