name: CI

# PRs only. Trunk changes exclusively via auto-merged PRs whose CI already
# passed, and the ruleset requires branches be up to date before merging (so the
# merged result was tested) — a post-merge `push` run on trunk would just be a
# redundant re-run. Running on both `push` and `pull_request` is also what
# doubles every check on a branch that has an open PR.
# `labeled`/`unlabeled` are included so that applying the `gate-change-approved`
# label re-runs CI — that re-evaluates the Gate integrity job, which reads the
# label, and lets a green run flow into auto-merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Restrict GITHUB_TOKEN to read-only by default; override per-job when more is needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref so stale CI can't race auto-merge and
# we don't burn minutes on commits that have already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas of the codebase changed so downstream jobs can skip
  # when irrelevant (e.g. docs-only PRs skip the Rust compile + Playwright).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      any_code: ${{ steps.filter.outputs.any_code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            frontend:
              - 'ui/**'
            desktop:
              - 'src-tauri/**'
              - 'ui/**'
            any_code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'ui/**'
              - 'src-tauri/**'
              - 'scripts/**'
              - '.github/**'
              - 'docs/use-cases.md'

  # Stops an agent from making CI green by deleting a test or loosening a gate
  # instead of fixing the code. Rides the CI-success rail: if this fails, the
  # whole run fails and auto-merge (gated on CI success) never fires. A deliberate
  # gate change is approved by the owner adding the `gate-change-approved` label.
  # Also fires unconditionally on label events so the label re-run always reaches
  # the guard even when no new code was pushed.
  gate-integrity:
    name: Gate integrity
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.any_code == 'true' || github.event.action == 'labeled' || github.event.action == 'unlabeled'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Guard against weakened tests/gates
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          GATE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'gate-change-approved') }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          scripts/gate-guard.sh "origin/$BASE_REF"

  check:
    name: Lint & test
    needs: changes
    # Windows matches the dev environment and the cfg(windows) cmd-quoting path.
    # (Adding an ubuntu leg to exercise the sh path is tracked in BACKLOG.md.)
    runs-on: windows-latest
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6

      # Pinned to match rust-toolchain.toml — bump both together.
      - name: Install Rust (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node (offline fake tracker in the black-box tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  coverage:
    name: Coverage
    needs: changes
    runs-on: windows-latest
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (+ llvm-tools)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Set up Node (offline fake tracker in the black-box tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Gate: line coverage must stay at/above the bar (the real gate), and emit
      # lcov for the Codecov badge. Baseline at last check was ~82%.
      - name: Coverage (fail under 80% lines)
        run: cargo llvm-cov --workspace --fail-under-lines 80 --lcov --output-path lcov.info

      # Best-effort upload for the README badge; never fails the gate (so a
      # missing CODECOV_TOKEN can't block merges).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend
    needs: changes
    runs-on: windows-latest
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint · format (Biome)
        run: pnpm run lint

      - name: Unit tests + coverage (Vitest)
        run: pnpm test:cov

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm run test:e2e

      # Reliability: on a failed (retried) run, keep the Playwright trace/report
      # so the failure is debuggable instead of a silent flake.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  desktop:
    name: Desktop app
    needs: changes
    # src-tauri is intentionally OUTSIDE the cargo workspace (WebView2 system
    # deps), so the workspace lint/test/coverage jobs never touch it. This job
    # is what actually gates the desktop shell: it must compile + pass clippy.
    runs-on: windows-latest
    if: needs.changes.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      # generate_context! embeds ui/dist at compile time, so the frontend
      # must be built before the shell will compile.
      - name: Build frontend (embedded by the shell)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # Aggregator: always runs so branch protection has a single stable required
  # check ("CI") even when upstream jobs are skipped for docs-only PRs.
  # Passes when every upstream job either succeeded or was skipped.
  # Branch protection must require this job's name — see setup-branch-protection.sh.
  ci:
    name: CI
    needs: [changes, gate-integrity, check, coverage, frontend, desktop]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' \
            | jq -e '[.[].result] | all(. == "success" or . == "skipped")'
