name: CI

# PRs only. Trunk changes exclusively via auto-merged PRs whose CI already
# passed, and the ruleset requires branches be up to date before merging (so the
# merged result was tested) — a post-merge `push` run on trunk would just be a
# redundant re-run. Running on both `push` and `pull_request` is also what
# doubles every check on a branch that has an open PR.
on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref so stale CI can't race auto-merge and
# we don't burn minutes on commits that have already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & test
    # Windows matches the dev environment and the cfg(windows) cmd-quoting path.
    # (Adding an ubuntu leg to exercise the sh path is tracked in BACKLOG.md.)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to match rust-toolchain.toml — bump both together.
      - name: Install Rust (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node (offline fake tracker in the black-box tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  coverage:
    name: Coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (+ llvm-tools)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Set up Node (offline fake tracker in the black-box tests)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Gate: line coverage must stay at/above the bar (the real gate), and emit
      # lcov for the Codecov badge. Baseline at last check was ~82%.
      - name: Coverage (fail under 80% lines)
        run: cargo llvm-cov --workspace --fail-under-lines 80 --lcov --output-path lcov.info

      # Best-effort upload for the README badge; never fails the gate (so a
      # missing CODECOV_TOKEN can't block merges).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint · format (Biome)
        run: pnpm run lint

      - name: Unit tests + coverage (Vitest)
        run: pnpm test:cov

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm run test:e2e

  desktop:
    name: Desktop app
    # src-tauri is intentionally OUTSIDE the cargo workspace (WebView2 system
    # deps), so the workspace lint/test/coverage jobs never touch it. This job
    # is what actually gates the desktop shell: it must compile + pass clippy.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      # generate_context! embeds ui/dist at compile time, so the frontend
      # must be built before the shell will compile.
      - name: Build frontend (embedded by the shell)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
