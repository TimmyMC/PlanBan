name: Auto-merge

# Trunk-based development: a PR into `trunk` merges itself once all checks pass
# (and, for `agent-review`-flagged PRs, once a higher-tier reviewer or an owner approves).
#
# Two triggers, one decision:
#   * workflow_run (CI complete success) — the original path. Gating here means
#     every CI job already finished green before merge is even considered; no
#     ordering footgun, no dependence on branch-protection settings.
#   * pull_request_review (submitted) — needed because an approval usually lands
#     *after* CI finished, so the workflow_run that validated the code ran before
#     the approval existed. Re-checking on the approval closes that gap.
# Either way the merge step re-verifies: not draft, no `do-not-merge`, CI complete
# is green, and the author/approval rule below is satisfied.
#
# Cascade: after queuing a merge, this workflow dispatches auto-update-prs.yml via
# workflow_dispatch so remaining behind PRs get swept. The normal `push` trigger on
# auto-update never fires — GitHub's recursion guard blocks push events from
# GITHUB_TOKEN merges — but workflow_dispatch is exempt from that guard.
#
# Author/approval rule:
#   * owner PR, or Dependabot bump with 100% compatibility score → CI green is enough.
#   * any other PR, including any Dependabot bump with <100% compat → also needs an
#     APPROVED review from a reviewer identity (repo var REVIEWER_LOGINS) or the owner.
#     Dependabot bumps with <100% compat carry the `agent-review` label (added by
#     dependabot-triage.yml) regardless of semver level, which overrides the Dependabot
#     auto-qualify below. 100%-compat bumps are auto-approved by triage and merge on
#     CI green alone — they never reach the approval check here.
#     An agent can't self-approve (distinct identity + GitHub blocks self-approval),
#     and an agent approval can NEVER clear a gate change — that still needs an
#     owner review, enforced separately in ci-complete.yml's gate-integrity job.

on:
  workflow_run:
    workflows: ["CI complete"]
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    name: merge passing PR
    runs-on: ubuntu-latest
    # workflow_run: a successful CI run for a PR. We accept CI runs triggered by
    # pull_request *and* pull_request_review, because a gate-change PR's "CI complete"
    # re-runs on the owner's approval (to re-evaluate gate-integrity) — that re-run is
    # what flips it green, and automerge must fire on it. review: an approval landing
    # after CI already finished. The merge step re-verifies everything either way.
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'pull_request_review')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved')
    steps:
      - name: Merge if eligible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # Space-separated reviewer-bot logins whose approval can merge a PR.
          # Unset ⇒ non-owner/non-dependabot PRs wait for a human (safe default).
          REVIEWER_LOGINS: ${{ vars.REVIEWER_LOGINS }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # 1) Resolve the PR for this event.
          if [ "$EVENT" = "workflow_run" ]; then
            pr=$(gh pr list --state open --limit 100 \
                   --json number,headRefOid --jq "[.[] | select(.headRefOid==\"$RUN_SHA\")][0].number")
          else
            pr="$REVIEW_PR"
          fi
          if [ -z "${pr:-}" ] || [ "$pr" = "null" ]; then
            echo "No open PR for this event; nothing to merge."; exit 0
          fi

          # 2) Common blockers: draft or an explicit human hold.
          read -r isDraft author <<<"$(gh pr view "$pr" --json isDraft,author \
            --jq '"\(.isDraft) \(.author.login)"')"
          labels=$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')
          [ "$isDraft" = "true" ] && { echo "PR #$pr is a draft — skip."; exit 0; }
          case ",$labels," in *",do-not-merge,"*) echo "PR #$pr held by do-not-merge — skip."; exit 0 ;; esac

          # 3) CI complete must be green (re-checked for the review-triggered path).
          # Take the LATEST "CI complete" run, not the first in the rollup: a gate-change
          # PR fails CI complete on the pre-approval push, so after the owner approves and
          # it re-runs green, BOTH a stale FAILURE and the fresh SUCCESS sit on the commit.
          # Indexing [0] could grab the stale failure and wrongly decline the merge. Also
          # wait if any "CI complete" run is still in flight.
          ci=$(gh pr view "$pr" --json statusCheckRollup --jq '
                 [.statusCheckRollup[] | select(.name == "CI complete")]
                 | if any(.status != "COMPLETED") then "PENDING"
                   else (sort_by(.completedAt) | last | .conclusion) // "PENDING"
                   end')
          if [ "$ci" != "SUCCESS" ]; then echo "PR #$pr: CI complete is $ci — wait."; exit 0; fi

          # 4) Eligibility.
          eligible=false
          lower=$(printf '%s' "$author" | tr '[:upper:]' '[:lower:]')

          # `agent-review` means "approval required regardless of author" —
          # dependabot-triage adds it for major bumps; it also covers any PR
          # manually routed for review. Without it, owner and patch/minor
          # Dependabot PRs qualify on CI green alone.
          case ",$labels," in
            *",agent-review,"*) ;;
            *)
              if [ "$author" = "$OWNER" ] || printf '%s' "$lower" | grep -q dependabot; then
                eligible=true
              fi
              ;;
          esac

          if [ "$eligible" != "true" ]; then
            # Needs an approval from a reviewer or the owner.
            declare -A last
            while IFS=$'\t' read -r login state; do
              case "$state" in APPROVED|CHANGES_REQUESTED|DISMISSED) last["$login"]="$state" ;; esac
            done < <(gh api --paginate "repos/$GH_REPO/pulls/$pr/reviews" \
                       --jq '.[] | [.user.login, .state] | @tsv')
            for who in $REVIEWER_LOGINS "$OWNER"; do
              [ "${last[$who]:-}" = "APPROVED" ] && eligible=true
            done
          fi

          if [ "$eligible" != "true" ]; then
            echo "PR #$pr not yet eligible (needs a reviewer or owner approval)."; exit 0
          fi

          echo "PR #$pr eligible (CI green, approval/author OK) — squash-merging."
          # --auto lets GitHub queue the merge through the branch-protection ruleset
          # rather than attempting an immediate merge that the ruleset may reject.
          gh pr merge "$pr" --squash --delete-branch --auto

          # Kick off the auto-update sweep for remaining open PRs. The normal push
          # trigger on auto-update-prs.yml never fires because GitHub's recursion
          # guard blocks push events when GITHUB_TOKEN does the squash merge.
          # workflow_dispatch is exempt from that guard and does fire.
          gh workflow run auto-update-prs.yml --repo "$GH_REPO" --ref trunk \
            || echo "::warning::cascade dispatch failed — sweep must be triggered manually"
