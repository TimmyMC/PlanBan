name: Agent · review

# Stage 3: reviews an `agent-review`-flagged PR with a model ONE TIER ABOVE the PR's
# complexity (haiku→Sonnet, sonnet→Opus, opus→Opus + a human). The reviewer runs
# as the installed Claude GitHub App — a DIFFERENT identity from the local
# implementer (Claude Code authed as the Zlyzart bot) — so:
#   * its APPROVE is a real second-party review (GitHub forbids self-approval), and
#   * that approval can NEVER clear a gate change (gate-integrity only honors an
#     owner login), so agents review ordinary PRs but never their own gate edits.
#
# On pass (non-opus): approve + mark the draft ready → automerge picks it up.
# On issues: request changes (stays draft) for the implementer loop to address.
# opus PRs: the reviewer posts findings but defers the merge decision to a human.

# Triggered when CI completes successfully (so we never review a red/half-built PR
# — that race is why we don't trigger on raw pull_request events), and on demand
# via the reconciler's dispatch. The PR is resolved from the CI run's head SHA.
on:
  workflow_run:
    # Every CI workflow whose checks must be green before we review. We re-evaluate on
    # each one's completion; the run fired by whichever finishes LAST finds all checks
    # green (see the all-green gate in the resolve step) and proceeds, earlier ones skip.
    # CI complete is the slowest, so it's usually last; CodeQL is GitHub's default-setup
    # code-scanning workflow. The gate is the real guarantee — this list just makes sure
    # a late finisher re-triggers the check.
    workflows: ["CI complete", "CodeQL"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write # claude-code-action@v1 exchanges an OIDC token for auth

concurrency:
  # One agent model session at a time across review + refine + reconciler — so never
  # more than one reviewer runs concurrently (the main usage-limit / token lever).
  # Redundant triggers don't waste tokens: the resolve step skips already-reviewed or
  # already-approved PRs before the model step runs.
  group: agents-global
  cancel-in-progress: false

jobs:
  review:
    name: Review agent PR
    runs-on: ubuntu-latest
    if: >
      vars.AGENTS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        (github.event.workflow_run.conclusion == 'success' ||
         github.event.workflow_run.conclusion == 'failure')))
    steps:
      - name: Resolve PR & reviewer tier
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_PR: ${{ github.event.inputs.pr }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PR:-}" ]; then
            PR="$INPUT_PR"
          else
            PR=$(gh pr list --state open --json number,headRefOid \
                   --jq "[.[] | select(.headRefOid==\"$RUN_SHA\")][0].number")
          fi
          if [ -z "${PR:-}" ] || [ "$PR" = "null" ]; then
            echo "No PR for this event."; echo "pr=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          # Review any PR flagged `agent-review` — an implementer's own PR, or a non-agent
          # PR routed here by triage (e.g. a major Dependabot bump — see dependabot-triage.yml).
          case ",$labels," in
            *",agent-review,"*) : ;;
            *) echo "PR #$PR is not flagged for agent review — skipping."; echo "pr=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          tier=$(printf '%s' "$labels" | tr ',' '\n' | grep '^complexity:' | head -1 || true)
          case "$tier" in
            complexity:haiku)  model="claude-sonnet-4-6"; human="false" ;;
            complexity:sonnet) model="claude-opus-4-8";   human="false" ;;
            complexity:opus)   model="claude-opus-4-8";   human="true"  ;;
            *) echo "PR #$PR has no complexity tier — skipping."; echo "pr=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Don't burn tokens on redundant reviews (the auto-update cascade re-runs CI,
          # and one SHA can trigger several events). Skip if the PR is already approved
          # (auto-merge will take it) or this exact commit was already reviewed.
          head=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')
          if [ "$(gh pr view "$PR" --json reviewDecision --jq '.reviewDecision // ""')" = "APPROVED" ]; then
            echo "PR #$PR already approved — skipping."; echo "pr=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          reviewed=$(gh api "repos/$GH_REPO/pulls/$PR/reviews" \
            --jq "[.[] | select(.commit_id==\"$head\" and .state!=\"PENDING\")] | length")
          if [ "${reviewed:-0}" -gt 0 ]; then
            echo "PR #$PR @ $head already reviewed — skipping."; echo "pr=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Diff-hash dedup. The auto-update cascade rebases a PR onto fresh trunk: new
          # head SHA, but the actual patch (the version bump) is unchanged. Re-reviewing
          # an identical diff is wasted tokens — BUT only safe to skip when this review is
          # ADVISORY: i.e. the PR touches CODEOWNERS-protected paths, so merging requires
          # an owner/code-owner approval the agent can't give anyway. For an agent-GATED
          # PR we must NOT skip — a rebase dismisses the agent's prior approval, and the
          # re-review is what re-grants it (skipping would strand the PR unmerged).
          files=$(gh pr view "$PR" --json files --jq '.files[].path')
          owner_gated=false
          if printf '%s\n' "$files" | grep -qE '^\.github/|^scripts/gate-guard\.sh$|^crates/cli/tests/use_case_coverage\.rs$|^crates/cli/tests/cli_docs\.rs$|^crates/core/tests/architecture\.rs$|^ui/src/use-case-coverage\.test\.ts$|^docs/use-cases\.md$|^docs/CONSTITUTION\.md$'; then
            owner_gated=true
          fi
          diff=$(gh pr diff "$PR" 2>/dev/null || true)
          diffhash=$(printf '%s' "$diff" | sha256sum | cut -c1-16)
          if [ "$owner_gated" = "true" ]; then
            prev=$(gh pr view "$PR" --json comments \
              --jq '[.comments[].body | select(test("agent-review-diffhash:"))] | last // ""' \
              | grep -oE 'agent-review-diffhash:[0-9a-f]+' | cut -d: -f2 || true)
            if [ -n "${prev:-}" ] && [ "$diffhash" = "$prev" ]; then
              echo "PR #$PR: diff unchanged ($diffhash) since last advisory review — skipping."
              echo "pr=" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          # Don't start if real lint/test checks are failing or pending. Gate integrity is
          # a human-auth gate (owner must approve), not a code-quality failure — a PR that
          # only fails gate integrity can and should still get a code review. We're
          # re-triggered on each CI workflow's completion, so the last one to finish is
          # where failing/pending reach zero and we proceed.
          checks=$(gh pr checks "$PR" --json name,conclusion 2>/dev/null || echo '[]')
          failing=$(printf '%s' "$checks" \
            | jq '[.[] | select((.conclusion // "" | ascii_downcase) == "failure")
                         | select(.name != "Gate integrity" and .name != "CI complete"
                                  and .name != "Approve patch/minor, route majors to agent review"
                                  and .name != "Backfill existing open Dependabot PRs")] | length')
          pending=$(printf '%s' "$checks" \
            | jq '[.[] | select(.conclusion == null or .conclusion == "")] | length')
          if [ "${failing:-1}" -gt 0 ] || [ "${pending:-1}" -gt 0 ]; then
            echo "PR #$PR not ready (failing=$failing, pending=$pending) — skipping."
            echo "pr=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Lightweight pass for dependency/version bumps (Dependabot author or the
          # `dependencies` label): the diff is a version pin, so a single direct read
          # beats spinning up the multi-agent /code-review pipeline. Everything else
          # gets the full pass.
          author=$(gh pr view "$PR" --json author --jq '.author.login')
          lightweight=false
          case ",$labels," in *",dependencies,"*) lightweight=true ;; esac
          if [ "$author" = "dependabot[bot]" ]; then lightweight=true; fi
          echo "pr=$PR"                >> "$GITHUB_OUTPUT"
          echo "model=$model"          >> "$GITHUB_OUTPUT"
          echo "human=$human"          >> "$GITHUB_OUTPUT"
          echo "lightweight=$lightweight" >> "$GITHUB_OUTPUT"
          echo "diffhash=$diffhash"    >> "$GITHUB_OUTPUT"
          echo "owner_gated=$owner_gated" >> "$GITHUB_OUTPUT"
          echo "Reviewing #$PR ($tier → reviewer $model, human-required=$human, lightweight=$lightweight)."

      - name: Check CLAUDE_CODE_OAUTH_TOKEN
        if: steps.pick.outputs.pr != ''
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set — the agent pipeline cannot run. Set this secret (Anthropic OAuth token for the account running the agents)."
            exit 1
          fi

      - name: Checkout repository
        if: steps.pick.outputs.pr != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review with Claude (tier+1)
        if: steps.pick.outputs.pr != ''
        env:
          # Marks the trusted CI reviewer context so the repo's deny-pr-write.sh
          # PreToolUse hook permits THIS session to `gh pr review` (its job).
          # The hook still blocks reviews/merges from local + interactive agents.
          CLABBY_REVIEW_CONTEXT: agent-review
        uses: anthropics/claude-code-action@v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Reviewing major Dependabot bumps is this job's purpose, but the action blocks
          # bot-initiated runs by default ("Workflow initiated by non-human actor:
          # dependabot"). The triggering actor for these reviews is dependabot[bot] (the
          # PR author), so allow it explicitly. Safe: triage gates entry (only PRs it
          # flagged `agent-review` reach here) and the reviewer only reads the diff.
          allowed_bots: "dependabot"
          # No github_token on purpose: with it omitted, the action authenticates as
          # the installed Claude GitHub App (the reviewer identity) — distinct from the
          # local implementer (Zlyzart), so its APPROVE is a real second-party review
          # and can't self-approve. Requirements for this to work:
          #   * the App must have Pull requests: Read & Write (so it can approve), and
          #   * its `<app-name>[bot]` login must be in the REVIEWER_LOGINS repo var, or
          #     auto-merge won't honor the approval.
          # Per claude-code-action docs, only set github_token when wiring your OWN
          # custom app instead of the installed one. (Was: secrets.REVIEWER_TOKEN, a
          # PAT — unsupported now; the App is the supported reviewer auth.)
          # No plugin marketplace/plugin for the lightweight (dependency-bump) pass — the
          # /code-review multi-agent pipeline is overkill for a version-pin diff and is
          # the dominant token cost. The full pass keeps it.
          plugin_marketplaces: ${{ steps.pick.outputs.lightweight == 'true' && '' || 'https://github.com/anthropics/claude-code.git' }}
          plugins: ${{ steps.pick.outputs.lightweight == 'true' && '' || 'code-review@claude-code-plugins' }}
          claude_args: '--model ${{ steps.pick.outputs.model }} --allowed-tools "Bash,Read,Grep,Glob"'
          prompt: |
            Review the code changes in PR #${{ steps.pick.outputs.pr }} of
            ${{ github.repository }}. Look ONLY at the diff: correctness, bugs, and
            logic. Do NOT comment on CI status (gated separately), the Constitution /
            CLAUDE.md, or process. No preamble, no headers, no recap of the PR.

            You ARE the authorized reviewer (the installed claude[bot] App) in the
            trusted reviewer context — submit the review YOURSELF with `gh`; never defer
            it or settle for a plain comment.

            ${{ steps.pick.outputs.lightweight == 'true' && 'This is a small dependency/version bump — review the diff DIRECTLY in a single pass (do NOT invoke /code-review or any multi-agent tool), then act with `gh`:' || 'Run `/code-review` for the detailed pass, then act with `gh`:' }}
            - A real problem in the code → `gh pr review ${{ steps.pick.outputs.pr }} --request-changes`
              with specific file:line findings only; add the `review:changes-requested`
              label and remove `review:passed`; keep it a draft.
            - The code is correct → `gh pr review ${{ steps.pick.outputs.pr }} --approve`
              with a body of at most 3 short bullets naming what you checked in the diff;
              add `review:passed` and remove `review:changes-requested`;
              `gh pr ready ${{ steps.pick.outputs.pr }}`.
            - human-required "${{ steps.pick.outputs.human }}" == "true" (opus tier): do
              NOT approve or mark ready — post a brief, code-focused assessment and note a
              human must approve.

            Be terse. No fluff or bloat.

      # Record the reviewed diff hash so a later rebase that doesn't change the patch can
      # be skipped (see the dedup in the resolve step). Only for owner-gated PRs, where the
      # agent review is advisory — for agent-gated PRs the dedup is intentionally disabled,
      # so no marker is needed. A single sticky comment, edited in place to avoid clutter.
      - name: Record reviewed diff hash (advisory reviews only)
        if: steps.pick.outputs.pr != '' && steps.pick.outputs.owner_gated == 'true' && steps.pick.outputs.diffhash != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pick.outputs.pr }}
          HASH: ${{ steps.pick.outputs.diffhash }}
        run: |
          set -euo pipefail
          body="_Agent review tracked (advisory; owner approval still required)._ <!-- agent-review-diffhash:$HASH -->"
          gh pr comment "$PR" --repo "$GH_REPO" --edit-last --body "$body" \
            || gh pr comment "$PR" --repo "$GH_REPO" --body "$body"
