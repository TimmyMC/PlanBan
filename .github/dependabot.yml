version: 2
updates:
  # Rust workspace (clabby-core + clabby CLI).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-deps:
        patterns: ["*"]

  # The Tauri shell is a standalone crate outside the workspace.
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Frontend.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The CI/automerge workflows themselves.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
