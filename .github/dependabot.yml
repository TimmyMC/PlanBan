version: 2
updates:
  # Rust workspace (clabby-core + clabby CLI).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-deps:
        patterns: ["*"]

  # The Tauri shell is a standalone crate outside the workspace.
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Frontend.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The CI/automerge workflows themselves.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # dtolnay/rust-toolchain tags are Rust *channels* (1.96.0, …), not action
      # releases. The Rust version is pinned deliberately in rust-toolchain.toml
      # and bumped by hand, so don't let Dependabot propose it here — it
      # mis-reads the tags and suggests non-existent versions (e.g. 1.100.0).
      - dependency-name: dtolnay/rust-toolchain
