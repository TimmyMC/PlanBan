# Path filters for the CI complete workflow (consumed by dorny/paths-filter in the
# `changes` job). Defined here, once, with YAML anchors so `any_code` is derived from
# the others and can never drift out of sync.
#
# Change-to-impact matrix (jobs that run when a path changes):
#
#   Path changed                          | Lint&test | Coverage | Frontend | Desktop | Gate integrity
#   --------------------------------------|-----------|----------|----------|---------|---------------
#   crates/**, Cargo.*, diesel.toml       |    run    |   run    |    -     |   run   |     run
#   rust-toolchain.toml                   |    run    |   run    |    -     |   run   |     run
#   ui/**                                 |    -      |    -     |   run    |   run   |     run
#   src-tauri/**                          |    -      |    -     |    -     |   run   |     run
#   .github/workflows/**, filters.yml,    |    run    |   run    |   run    |   run   |     run
#     coverage-thresholds.json (= &ci)    |           |          |          |         |
#   scripts/**, other .github/**, uc.md   |    -      |    -     |    -     |    -    |     run
#   docs/** (incl. examples), other *.md  |    -      |    -     |    -     |    -    |      -
#
# The `ci-complete` aggregator always runs and is the single required status check, so a
# PR that skips every job above still reports green.

# CI definition files that change how the build jobs themselves run: the workflow, the
# path filters that decide what runs, and the coverage thresholds the jobs enforce.
# Folded into rust/frontend/desktop below so editing any of them re-runs the affected
# jobs — otherwise a workflow-logic or threshold edit would ship untested (the very job
# it changes would be path-filtered out). Other .github/** files (dependabot, CODEOWNERS,
# issue templates) don't change job behavior, so they only hit gate-integrity via
# any_code's `.github/**` below.
ci: &ci
  - '.github/workflows/**'
  - '.github/filters.yml'
  - '.github/coverage-thresholds.json'

# The workspace: the crates plus the root files Cargo/rustup force to live at the repo
# root (manifest, lockfile, toolchain). diesel.toml lives under crates/core, so crates/**
# already covers it. `&toolchain` is shared with the desktop crate below.
rust: &rust
  - 'crates/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - &toolchain 'rust-toolchain.toml'
  - *ci

frontend: &frontend
  - 'ui/**'
  - *ci

# The Tauri shell is a separate crate outside the workspace, but it depends on clabby-core
# (a path dep) AND embeds ui/dist at compile time — so a change to the Rust crates or the
# frontend can break its compile/tests. Run it on `*rust` (crates/**, Cargo.*, toolchain)
# and `*frontend`, not just `src-tauri/**`, so core/UI drift can't ship a broken shell
# untested. (`*rust` already includes `*toolchain` and `*ci`.)
desktop:
  - 'src-tauri/**'
  - *rust
  - *frontend

# Gate-integrity must run whenever any gate-relevant file changes. Built from the anchors
# above plus the non-build paths, so adding a path to `rust`/`frontend` updates this too.
any_code:
  - *rust
  - *frontend
  - 'src-tauri/**'
  - 'scripts/**'
  - '.github/**'
  - 'docs/use-cases.md'
