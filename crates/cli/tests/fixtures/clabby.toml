[project]
name = "Test"
db_path = ".clabby/clabby.db"
worktrees_dir = "wt"

[tracker]
fetch = "node tracker.mjs issues.json fetch"
push  = "node tracker.mjs issues.json transition {{ key }} \"{{ status }}\""
jql   = ""

[tracker.map]
items   = "issues"
key     = "key"
summary = "fields.summary"
status  = "fields.status.name"

[agents.echo]
cmd = "echo ran agent for {{ issue_key }}"

[[cron]]
schedule = "0 0 * * * *"
action = "sync"

# A transition whose steps all pass.
[[transitions]]
from = "In Progress"
to = "In Review"
steps = [
    { id = "announce", cmd = "echo moving {{ key }} to {{ to }}" },
]

# A transition with a required step that fails, to exercise the gate + override.
[[transitions]]
from = "In Review"
to = "Done"
steps = [
    { id = "announce", cmd = "echo finalizing {{ key }}" },
    { id = "gate", cmd = "node -e \"process.exit(1)\"", required = true },
]
