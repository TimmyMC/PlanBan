# cargo-deny policy. Run locally with `cargo deny check`; enforced by the
# `supply-chain` CI job. Scope: the main workspace (clabby-core + clabby CLI).
# src-tauri (the Tauri shell) is a separate manifest and is checked on its own
# once its heavier dependency tree is curated (tracked in docs/quality-roadmap.md).

[advisories]
version = 2
yanked = "deny"
# Add a RUSTSEC id here only with a justifying comment if it must be temporarily
# tolerated (e.g. no patched release yet).
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. A copyleft/unknown license is a deliberate decision,
# not a silent transitive surprise — add it here with a comment if ever needed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]

[bans]
# Duplicate versions are a warning (common transitively); wildcards are denied so
# every external dependency carries a real version requirement.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
